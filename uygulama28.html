<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Işlemleri</title>
</head>
<body>
    <div class="container p-3 my-3 bg-dark text-white"><!-- container ile kutunun kenarlarında sağdan ve soldan boşluk olşturdum
        iç boşluğunu 3, dış boşluğunu üstten ve alttan 3, arka planını siyah, yazı rengini beyaz yaptım. -->
        <h1>Sipariş Listesi</h1><!-- Sipariş listesi adında üst başlık oluşturdum.-->
        
            <form>
                <input type="checkbox" name="onay1">Çay <br><!-- giriş tipini işaretleme etiketli yaptım. arka planda görülecek
                name onay1 yaptım.-->
                <input type="checkbox" name="onay2" checked > Tost <br><!-- giriş tipini işaretleme etiketli yaptım. arka planda görülecek
                name onay2 yaptım ve işaretleme etiketini seçili hale getridim.-->
                <input type="checkbox" name="onay3" disabled> Hamburger <br><!-- giriş tipini işaretleme etiketli yaptım. arka planda görülecek
                name onay3 yaptım ve işarteleme etiketini pasif hale getirdim.-->
                <input type="checkbox" name="onay4"> Köfte Ekmek<!-- giriş tipini işaretleme etiketli yaptım. arka planda görülecek
                name onay4 yaptım.-->
</form>

</div>

</body>
</html>
