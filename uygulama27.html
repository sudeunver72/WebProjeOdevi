<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Işlemleri</title>
</head>
<body>
    
<div style="height: 250px; 
width:400px;
color:aliceblue;
border:2px solid black;
padding:25px;
background:crimson;"><!-- En üst satırda bir kutu oluşturdum ve kutunun yüksekliğini 250 px yaptım.
İkinci satırda ise kutunun genisşiliğini 400 px yaptım.
Üçüncü satırda yazının rengini alice blue yaptım.
Dördüncü satırda ise kutunun kenarlık sayısnı 2 px ve rengini black yaptım.
Beşinci satırda iç boşluğunu 25 px yaptım.
Altıncı satırda ise arka planını crimson yaptım.-->
<form>
    <h3 style="text-align:center;">Password Örneği</h3><!-- password örneği yazısını başlık haline getirdim ve ortaladım.-->
    <label>Kullanici Adiniz:</label><!-- kullanıcı görsün diye label ile kullanıcı adınız ibaresini veren bir bilgi metni oluşturdum.-->
    <input type="text" class="form-control" name="kAdi"> <!--giriş tipini metinsel,sınıfını form-control,name ni yani arka planda 
    gözüken kullanıcı adını kAdi yaptım. -->
    <label>Sifreniz</label><!-- kullanıcı görsün diye sifreniz yazısını veren metni oluşturdum.-->
    <input type="password" class="form-control" name="sifre"><!-- giriş tipini password,sınıfını form-control,name ni yanı arka planda
    gözoüken şifre giriş yerini sifre yaptım. -->

    </form>
    
</div>

</body>
</html>
